# Generated by HostPanel installer. Managed through the panel API.
launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes

local-address={{PDNS_LISTEN}}
local-port=53

api=yes
api-key={{PDNS_KEY}}
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1,::1

default-soa-content={{NS1}}. hostmaster.@ 0 10800 3600 604800 3600
default-ttl=3600
version-string=anonymous

# Extra settings written by the panel (secondary nameserver replication).
include-dir=/etc/powerdns/pdns.d
