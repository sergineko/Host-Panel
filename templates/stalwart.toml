# Generated by HostPanel installer.
# Domains, mailboxes and DKIM keys are managed from the panel through the HTTP API.

[server]
hostname = "{{MAIL_HOSTNAME}}"

[server.listener.smtp]
bind = ["{{ANY}}:25"]
protocol = "smtp"

[server.listener.submission]
bind = ["{{ANY}}:587"]
protocol = "smtp"

[server.listener.submissions]
bind = ["{{ANY}}:465"]
protocol = "smtp"
tls.implicit = true

[server.listener.imaps]
bind = ["{{ANY}}:993"]
protocol = "imap"
tls.implicit = true

[server.listener.sieve]
bind = ["{{ANY}}:4190"]
protocol = "managesieve"

# Management API (only reachable from this machine; webmail autoconfig is proxied by Caddy).
[server.listener.http]
bind = ["127.0.0.1:8080"]
protocol = "http"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

[tracer.log]
type = "log"
level = "info"
path = "/opt/stalwart/logs"
prefix = "stalwart.log"
rotate = "daily"
ansi = false
enable = true

[authentication.fallback-admin]
user = "admin"
secret = "{{STALWART_PASSWORD}}"

# Self-signed at install time; replaced by the Let's Encrypt certificate that Caddy
# obtains for the mail hostname (the panel copies it every hour).
[certificate.default]
cert = "%{file:/opt/stalwart/etc/certs/mail.crt}%"
private-key = "%{file:/opt/stalwart/etc/certs/mail.key}%"
default = true
